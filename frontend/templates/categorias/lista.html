{% extends "base.html" %}
{% block titulo %}Categorias · Controle de Finanças{% endblock %}
{% block conteudo %}
<div class="cab"><h1>Categorias</h1>
  <a class="btn" href="{{ url_for('categorias.nova') }}">+ Nova categoria</a></div>
<table>
  <thead><tr><th>Nome</th><th>Tipo</th><th class="acoes">Ações</th></tr></thead>
  <tbody>
  {% for c in categorias %}
    <tr>
      <td>{{ c.nome }}</td>
      <td><span class="tag tag-{{ c.tipo }}">{{ c.tipo|capitalize }}</span></td>
      <td class="acoes">
        <a href="{{ url_for('categorias.editar', id=c.id) }}">Editar</a>
        <form method="post" action="{{ url_for('categorias.excluir', id=c.id) }}" onsubmit="return confirm('Excluir a categoria {{ c.nome }}?');">
          <button class="link-perigo" type="submit">Excluir</button>
        </form>
      </td>
    </tr>
  {% else %}
    <tr><td colspan="3" class="vazio">Nenhuma categoria cadastrada.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
