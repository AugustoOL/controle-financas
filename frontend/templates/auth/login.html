{% extends "base.html" %}
{% block titulo %}Entrar · Controle de Finanças{% endblock %}
{% block conteudo %}
<h1>Entrar</h1>
<form method="post" class="form">
  <label for="email">E-mail</label>
  <input id="email" name="email" type="email" maxlength="120" required autocomplete="email" value="{{ form.get('email', '') }}">
  <label for="senha">Senha</label>
  <input id="senha" name="senha" type="password" required autocomplete="current-password">
  <div class="botoes">
    <button class="btn" type="submit">Entrar</button>
    <a class="btn btn-sec" href="{{ url_for('auth.cadastro') }}">Criar conta</a>
  </div>
</form>
{% endblock %}
